<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory Management - DineFlow Admin</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

  <!-- Sidebar -->
  <aside class="admin-sidebar" id="adminSidebar">
    <div class="admin-brand" onclick="window.location.href='index.html'">
      DineFlow Admin
    </div>
    <div class="admin-menu">
      <a href="admin_dashboard.html"><span class="admin-menu-icon">📊</span> Dashboard</a>
      <a href="admin_food.html"><span class="admin-menu-icon">🍔</span> Food Menu</a>
      <a href="admin_inventory.html" class="active"><span class="admin-menu-icon">📦</span> Inventory</a>
      <a href="admin_billing.html"><span class="admin-menu-icon">🧾</span> Billing</a>
      <a href="admin_reviews.html"><span class="admin-menu-icon">⭐</span> Reviews</a>
      <a href="admin_sales.html"><span class="admin-menu-icon">📈</span> Sales Report</a>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="admin-main">
    <header class="admin-navbar">
      <div class="admin-nav-left">
        <button class="menu-toggle" onclick="toggleAdminMenu()">☰</button>
        <div class="admin-nav-title">Inventory Management</div>
      </div>
      <div class="admin-nav-right">
        <div class="admin-profile">
          <span>Admin User</span>
          <div class="admin-avatar">A</div>
        </div>
      </div>
    </header>

    <div class="admin-content page-anim">
      <div class="admin-card">
        <div class="admin-card-header">
          <div class="admin-card-title">Inventory Items</div>
          <div class="admin-actions">
            <input type="text" id="invSearch" class="admin-search" placeholder="Search inventory..." onkeyup="filterInventory()">
            <select id="invFilter" class="admin-search" onchange="filterInventory()" style="width: 150px;">
              <option value="all">All Items</option>
              <option value="low">Low Stock Only</option>
            </select>
            <button class="admin-btn" onclick="openInvModal('add')">➕ Add Item</button>
          </div>
        </div>
        <div class="table-responsive">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Item ID</th>
                <th>Item Name</th>
                <th>Category</th>
                <th>Quantity</th>
                <th>Stock Status</th>
                <th>Last Updated</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="inventoryTableBody">
              <!-- Rendered via JS -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <!-- Add/Edit Inventory Modal -->
  <div class="admin-modal-overlay" id="invModal">
    <div class="admin-modal">
      <div class="admin-modal-header">
        <h2 id="invModalTitle">Add Inventory Item</h2>
        <button class="admin-modal-close" onclick="closeAdminModal('invModal')">✕</button>
      </div>
      <form id="invForm" onsubmit="saveInventory(event)">
        <input type="hidden" id="i-id">
        <div class="admin-form-group">
          <label>Item Name *</label>
          <input type="text" id="i-name" required placeholder="e.g. Tomato Ketchup">
        </div>
        <div class="admin-form-group">
          <label>Category *</label>
          <input type="text" id="i-cat" required placeholder="e.g. Sauces">
        </div>
        <div style="display: flex; gap: 16px;">
          <div class="admin-form-group" style="flex: 1;">
            <label>Quantity *</label>
            <input type="number" id="i-qty" required min="0" placeholder="0">
          </div>
          <div class="admin-form-group" style="flex: 1;">
            <label>Unit *</label>
            <select id="i-unit" required>
              <option value="kg">kg</option>
              <option value="L">L</option>
              <option value="pcs">pcs</option>
              <option value="boxes">boxes</option>
            </select>
          </div>
        </div>
        <div class="admin-modal-footer">
          <button type="button" class="admin-btn secondary" onclick="closeAdminModal('invModal')">Cancel</button>
          <button type="submit" class="admin-btn">Save Item</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/admin.js"></script>
  <script>
    let localInv = [...INVENTORY];

    document.addEventListener('DOMContentLoaded', () => {
      renderInventoryTable(localInv);
    });

    function renderInventoryTable(data) {
      const tbody = document.getElementById('inventoryTableBody');
      tbody.innerHTML = data.map(item => {
        const isLow = item.qty < 10; // Logic for low stock
        const status = isLow ? 'Low Stock' : 'In Stock';
        const badgeClass = isLow ? 'danger' : 'success';
        const qtyStyle = isLow ? 'color: var(--pink); font-weight: 900;' : '';

        return `
          <tr>
            <td>${item.id}</td>
            <td><strong>${item.name}</strong></td>
            <td>${item.cat}</td>
            <td style="${qtyStyle}">${item.qty} ${item.unit}</td>
            <td><span class="status-badge ${badgeClass}">${status}</span></td>
            <td style="color: var(--muted); font-size: 0.85rem;">${item.updated}</td>
            <td>
              <div class="action-btns">
                <button class="icon-btn edit" onclick="openInvModal('edit', '${item.id}')" title="Edit/Restock">✏️</button>
                <button class="icon-btn delete" onclick="deleteInventory('${item.id}')" title="Delete">🗑️</button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    function filterInventory() {
      const q = document.getElementById('invSearch').value.toLowerCase();
      const filter = document.getElementById('invFilter').value;
      
      let filtered = localInv.filter(item => {
        const matchQ = item.name.toLowerCase().includes(q) || item.id.toLowerCase().includes(q);
        const matchFilter = filter === 'all' || (filter === 'low' && item.qty < 10);
        return matchQ && matchFilter;
      });
      renderInventoryTable(filtered);
    }

    function openInvModal(mode, id = null) {
      const form = document.getElementById('invForm');
      form.reset();
      
      if (mode === 'add') {
        document.getElementById('invModalTitle').textContent = 'Add Inventory Item';
        document.getElementById('i-id').value = '';
      } else {
        document.getElementById('invModalTitle').textContent = 'Update Inventory';
        const item = localInv.find(i => i.id === id);
        if (item) {
          document.getElementById('i-id').value = item.id;
          document.getElementById('i-name').value = item.name;
          document.getElementById('i-cat').value = item.cat;
          document.getElementById('i-qty').value = item.qty;
          document.getElementById('i-unit').value = item.unit;
        }
      }
      openAdminModal('invModal');
    }

    function saveInventory(e) {
      e.preventDefault();
      const id = document.getElementById('i-id').value;
      const name = document.getElementById('i-name').value;
      const cat = document.getElementById('i-cat').value;
      const qty = parseInt(document.getElementById('i-qty').value);
      const unit = document.getElementById('i-unit').value;
      const today = new Date().toISOString().split('T')[0];
      const status = qty < 10 ? 'Low Stock' : 'In Stock';

      if (id) {
        // Edit
        const index = localInv.findIndex(i => i.id === id);
        if (index > -1) {
          localInv[index].name = name;
          localInv[index].cat = cat;
          localInv[index].qty = qty;
          localInv[index].unit = unit;
          localInv[index].status = status;
          localInv[index].updated = today;
        }
      } else {
        // Add
        const newId = generateId('INV');
        localInv.push({ id: newId, name, cat, qty, unit, status, updated: today });
      }

      closeAdminModal('invModal');
      filterInventory();
      alert(id ? 'Inventory updated!' : 'Inventory item added!');
    }

    function deleteInventory(id) {
      if (confirm('Are you sure you want to delete this inventory item?')) {
        localInv = localInv.filter(i => i.id !== id);
        filterInventory();
      }
    }
  </script>
</body>
</html>

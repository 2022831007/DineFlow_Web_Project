<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Management - DineFlow Admin</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

  <!-- Sidebar -->
  <aside class="admin-sidebar" id="adminSidebar">
    <div class="admin-brand" onclick="window.location.href='index.html'">
      DineFlow Admin
    </div>
    <div class="admin-menu">
      <a href="admin_dashboard.html"><span class="admin-menu-icon">📊</span> Dashboard</a>
      <a href="admin_food.html" class="active"><span class="admin-menu-icon">🍔</span> Food Menu</a>
      <a href="admin_inventory.html"><span class="admin-menu-icon">📦</span> Inventory</a>
      <a href="admin_billing.html"><span class="admin-menu-icon">🧾</span> Billing</a>
      <a href="admin_reviews.html"><span class="admin-menu-icon">⭐</span> Reviews</a>
      <a href="admin_sales.html"><span class="admin-menu-icon">📈</span> Sales Report</a>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="admin-main">
    <header class="admin-navbar">
      <div class="admin-nav-left">
        <button class="menu-toggle" onclick="toggleAdminMenu()">☰</button>
        <div class="admin-nav-title">Food Management</div>
      </div>
      <div class="admin-nav-right">
        <div class="admin-profile">
          <span>Admin User</span>
          <div class="admin-avatar">A</div>
        </div>
      </div>
    </header>

    <div class="admin-content page-anim">
      <div class="admin-card">
        <div class="admin-card-header">
          <div class="admin-card-title">Food Menu List</div>
          <div class="admin-actions">
            <input type="text" id="foodSearch" class="admin-search" placeholder="Search food..." onkeyup="filterFood()">
            <select id="foodCategory" class="admin-search" onchange="filterFood()" style="width: 150px;">
              <option value="all">All Categories</option>
              <option value="burger">Burgers</option>
              <option value="rice">Rice & Biryani</option>
              <option value="pizza">Pizza</option>
              <option value="dessert">Dessert</option>
              <option value="drinks">Drinks</option>
            </select>
            <button class="admin-btn" onclick="openFoodModal('add')">➕ Add Food</button>
          </div>
        </div>
        <div class="table-responsive">
          <table class="admin-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Image</th>
                <th>Food Name</th>
                <th>Category</th>
                <th>Price</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="foodTableBody">
              <!-- Rendered via JS -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <!-- Add/Edit Food Modal -->
  <div class="admin-modal-overlay" id="foodModal">
    <div class="admin-modal">
      <div class="admin-modal-header">
        <h2 id="foodModalTitle">Add New Food</h2>
        <button class="admin-modal-close" onclick="closeAdminModal('foodModal')">✕</button>
      </div>
      <form id="foodForm" onsubmit="saveFood(event)">
        <input type="hidden" id="f-id">
        <div class="admin-form-group">
          <label>Food Name *</label>
          <input type="text" id="f-name" required placeholder="e.g. Classic Burger">
        </div>
        <div class="admin-form-group">
          <label>Category *</label>
          <select id="f-cat" required>
            <option value="burger">Burger</option>
            <option value="rice">Rice & Biryani</option>
            <option value="pizza">Pizza</option>
            <option value="dessert">Dessert</option>
            <option value="drinks">Drinks</option>
          </select>
        </div>
        <div class="admin-form-group">
          <label>Price (৳) *</label>
          <input type="number" id="f-price" required min="1" placeholder="e.g. 250">
        </div>
        <div class="admin-form-group">
          <label>Image URL *</label>
          <input type="url" id="f-img" required placeholder="https://example.com/image.jpg">
        </div>
        <div class="admin-form-group">
          <label>Status *</label>
          <select id="f-status" required>
            <option value="Available">Available</option>
            <option value="Out of Stock">Out of Stock</option>
          </select>
        </div>
        <div class="admin-modal-footer">
          <button type="button" class="admin-btn secondary" onclick="closeAdminModal('foodModal')">Cancel</button>
          <button type="submit" class="admin-btn">Save Food</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/admin.js"></script>
  <script>
    let localMenu = [...MENU];

    document.addEventListener('DOMContentLoaded', () => {
      renderFoodTable(localMenu);
    });

    function renderFoodTable(data) {
      const tbody = document.getElementById('foodTableBody');
      tbody.innerHTML = data.map(item => {
        // Mock status based on badge or just assume available
        const status = item.badge === 'Out of Stock' ? 'Out of Stock' : 'Available';
        const badgeClass = status === 'Available' ? 'success' : 'danger';
        
        return `
          <tr>
            <td>#${item.id}</td>
            <td>
              ${item.img.startsWith('data:') || item.img.startsWith('http') ? 
                `<img src="${item.img}" class="table-img" alt="${item.name}">` : 
                `<div style="font-size: 2rem;">${item.emoji}</div>`}
            </td>
            <td><strong>${item.name}</strong></td>
            <td style="text-transform: capitalize;">${item.cat}</td>
            <td>৳${item.price}</td>
            <td><span class="status-badge ${badgeClass}">${status}</span></td>
            <td>
              <div class="action-btns">
                <button class="icon-btn edit" onclick="openFoodModal('edit', ${item.id})" title="Edit">✏️</button>
                <button class="icon-btn delete" onclick="deleteFood(${item.id})" title="Delete">🗑️</button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    function filterFood() {
      const q = document.getElementById('foodSearch').value.toLowerCase();
      const cat = document.getElementById('foodCategory').value;
      
      let filtered = localMenu.filter(item => {
        const matchQ = item.name.toLowerCase().includes(q) || item.id.toString().includes(q);
        const matchCat = cat === 'all' || item.cat === cat;
        return matchQ && matchCat;
      });
      renderFoodTable(filtered);
    }

    function openFoodModal(mode, id = null) {
      const form = document.getElementById('foodForm');
      form.reset();
      
      if (mode === 'add') {
        document.getElementById('foodModalTitle').textContent = 'Add New Food';
        document.getElementById('f-id').value = '';
      } else {
        document.getElementById('foodModalTitle').textContent = 'Edit Food';
        const item = localMenu.find(i => i.id === id);
        if (item) {
          document.getElementById('f-id').value = item.id;
          document.getElementById('f-name').value = item.name;
          document.getElementById('f-cat').value = item.cat;
          document.getElementById('f-price').value = item.price;
          document.getElementById('f-img').value = item.img;
          document.getElementById('f-status').value = item.badge === 'Out of Stock' ? 'Out of Stock' : 'Available';
        }
      }
      openAdminModal('foodModal');
    }

    function saveFood(e) {
      e.preventDefault();
      const id = document.getElementById('f-id').value;
      const name = document.getElementById('f-name').value;
      const cat = document.getElementById('f-cat').value;
      const price = parseInt(document.getElementById('f-price').value);
      const img = document.getElementById('f-img').value;
      const status = document.getElementById('f-status').value;

      // Basic validation is handled by HTML5 required attributes
      if (price <= 0) {
        alert('Price must be greater than 0');
        return;
      }

      if (id) {
        // Edit
        const index = localMenu.findIndex(i => i.id == id);
        if (index > -1) {
          localMenu[index].name = name;
          localMenu[index].cat = cat;
          localMenu[index].price = price;
          localMenu[index].img = img;
          localMenu[index].badge = status === 'Out of Stock' ? 'Out of Stock' : '';
          localMenu[index].badgeClass = status === 'Out of Stock' ? 'danger' : '';
        }
      } else {
        // Add
        const newId = localMenu.length > 0 ? Math.max(...localMenu.map(m => m.id)) + 1 : 1;
        localMenu.push({
          id: newId,
          name,
          desc: 'New item added by admin',
          price,
          emoji: '🍽️',
          cat,
          img,
          badge: status === 'Out of Stock' ? 'Out of Stock' : 'New',
          badgeClass: status === 'Out of Stock' ? 'danger' : 'purple',
          rating: 0,
          reviews: 0
        });
      }

      closeAdminModal('foodModal');
      filterFood(); // Re-render with current filters
      alert(id ? 'Food updated successfully!' : 'Food added successfully!');
    }

    function deleteFood(id) {
      if (confirm('Are you sure you want to delete this food item?')) {
        localMenu = localMenu.filter(i => i.id !== id);
        filterFood();
      }
    }
  </script>
</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register – DineFlow</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/menu.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 100px 16px 40px;
      background: linear-gradient(135deg, #FFF5F8 0%, #FFE8EF 100%);
    }
    .auth-card {
      background: #fff;
      border-radius: 24px;
      padding: 40px;
      width: min(520px, 100%);
      box-shadow: 0 8px 40px rgba(255,45,120,.12);
      animation: popIn .35s cubic-bezier(.4,0,.2,1);
    }
    @keyframes popIn {
      from { transform: scale(.92); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }
    .auth-logo {
      font-family: 'Pacifico', cursive; font-size: 2rem;
      background: linear-gradient(135deg, var(--pink), var(--orange));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      text-align: center; margin-bottom: 8px;
    }
    .auth-card h2  { text-align: center; font-size: 1.4rem; font-weight: 900; margin-bottom: 6px; }
    .auth-card .sub{ text-align: center; color: var(--muted); font-size: .9rem; margin-bottom: 28px; font-weight: 600; }
    .auth-switch   { text-align: center; margin-top: 16px; font-size: .9rem; font-weight: 600; color: var(--muted); }
    .auth-switch a { color: var(--pink); font-weight: 800; }
  </style>
</head>
<body>
<nav>
  <div class="nav-logo" onclick="window.location.href='index.html'">DineFlow</div>
  <div class="nav-links">
    <a href="index.html">🏠 Home</a>
    <a href="menu.html">🍽️ Menu</a>
    <a href="tracking.html">📍 Track Order</a>
    <a href="reviews.html">⭐ Reviews</a>
  </div>
  <div class="nav-right">
    <button class="auth-btn" onclick="window.location.href='login.html'">Sign In</button>
  </div>
</nav>

<!-- Register Form -->
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">DineFlow</div>
    <h2>Create Account 🎉</h2>
    <div class="sub">Join DineFlow and start ordering!</div>

    <div class="form-row">
      <div class="form-group">
        <label>First Name</label>
        <input type="text" id="su-fname" placeholder="Rahim"/>
      </div>
      <div class="form-group">
        <label>Last Name</label>
        <input type="text" id="su-lname" placeholder="Uddin"/>
      </div>
    </div>
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="su-email" placeholder="you@email.com"/>
    </div>
    <div class="form-group">
      <label>Phone Number</label>
      <input type="text" id="su-phone" placeholder="+880 1XXX XXXXXX"/>
    </div>
    <div class="form-group">
      <label>Area / Locality</label>
      <input type="text" id="su-area" placeholder="Dhanmondi, Mymensingh…"/>
    </div>
    <div class="form-group">
      <label>Delivery Address</label>
      <textarea id="su-addr" rows="2" placeholder="House, Road, Landmark…"></textarea>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="su-pw" placeholder="Min 8 characters"/>
    </div>

    <button class="modal-submit" onclick="doSignup()">Create Account 🚀</button>

    <div class="auth-switch">
      Already have an account? <a href="login.html">Sign In</a>
    </div>
  </div>
</div>
<div class="toast" id="toast"><span id="toastMsg"></span></div>
<script src="js/toast.js"></script>
<script>
  function doSignup() {
    const fname = document.getElementById('su-fname').value.trim();
    const lname = document.getElementById('su-lname').value.trim();
    const email = document.getElementById('su-email').value.trim();
    const phone = document.getElementById('su-phone').value.trim();
    const area  = document.getElementById('su-area').value.trim();
    const addr  = document.getElementById('su-addr').value.trim();
    const pw    = document.getElementById('su-pw').value;

    if (!fname || !email || !phone || !addr || !pw) {
      showToast('⚠️ Please fill in all required fields');
      return;
    }

    const user = { name: `${fname} ${lname}`, email, phone, area, address: addr };
    sessionStorage.setItem('dineflow_user', JSON.stringify(user));
    showToast(`🎉 Welcome to DineFlow, ${fname}!`);
    setTimeout(() => window.location.href = 'index.html', 1000);
  }
</script>
</body>
</html>
